[project]
name = "data-load-quimia"
version = "0.1.0"
description = "Carga de dados (seed) Quimia"
readme = "README.md"
authors = [
    { name = "Nicolas Delecrode", email = "nicolas17delecrodepf@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faker>=40.40.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.3",
    "typer>=0.27.2",
    "rich>=15.0.0",
    "tzdata>=2026.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
seed = "seed.cli:main"

[tool.uv.build-backend]
module-name = "seed"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# S101: assert; S105/S106: senhas fictícias usadas de propósito nos testes.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
