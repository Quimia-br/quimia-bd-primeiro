# Cidades usadas para gerar localizações coerentes: o CEP é sorteado dentro da faixa
# da cidade e as coordenadas ficam perto do centro (até `raio_graus` de distância).
# Faixas de CEP por município conforme a tabela de faixas dos Correios e coordenadas
# aproximadas do centro: conferir antes de usar fora do banco de teste.
# CEPs e coordenadas entre aspas, para o YAML não converter em número.
cidades:
  - nome: "São Paulo"
    uf: "SP"
    cep_inicio: "01000000"
    cep_fim: "05999999"
    latitude: "-23.550520"
    longitude: "-46.633308"
