name: release-please

# Mantém aberto um PR de release com a próxima versão e o CHANGELOG, gerados a partir
# dos commits no padrão Conventional Commits. Ao mergear esse PR, a tag e a release
# do GitHub são criadas. Não publica nada em nenhum banco.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
